# Windows compatibility defaults for Conjunction OS.
# x86_64 ships Wine + DXVK + winetricks + umu-launcher; these variables avoid
# spurious Wine .desktop menu pollution and configure quiet DXVK/esync defaults.
# On aarch64 (which ships FEX-Emu + Box64 + winetricks rather than native Fedora
# Wine/umu), these variables remain inert until an x86_64 Wine runner is invoked.
WINEESYNC=1
WINEFSYNC=1
DXVK_LOG_LEVEL=none
WINEDLLOVERRIDES=winemenubuilder.exe=d
