# Calamares Bootloader Configuration for Conjunction Linux (systemd-boot UKI)
---
efiBootLoader: "systemd-boot"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
  - "timeout 5"
  - "console-mode max"

kernelParams: [ "quiet", "splash", "rw", "rootflags=subvol=@" ]

installEFIFallback: true
installHybridGRUB: false
