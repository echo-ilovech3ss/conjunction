# Post-install configuration for Conjunction Linux
---
dontChroot: false
timeout: 300
script:
  - "-/usr/bin/mkinitcpio -P"
  - "-/usr/bin/systemctl enable sddm.service"
  - "-/usr/bin/systemctl enable NetworkManager.service"
  - "-/usr/bin/systemctl set-default graphical.target"
  - "-/bin/rm -f /etc/sddm.conf.d/live-autologin.conf"
  - "-/bin/rm -f /etc/systemd/system/conjunction-live-init.service"
  - "-/bin/rm -f /etc/systemd/system/multi-user.target.wants/conjunction-live-init.service"
  - "-/bin/rm -f /etc/sudoers.d/10-conjunction-live"
  - "-/bin/rm -f /home/*/Desktop/conjunction-install.desktop"
  - "-/bin/rm -f /home/*/Desktop/calamares.desktop"
